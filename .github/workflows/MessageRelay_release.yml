name: MessageRelay_release

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Netum.Suovi.MessageRelay.sln --configuration Release

      - name: Test
        run: dotnet test Netum.Suovi.MessageRelay.sln --configuration Release --no-build

      - name: Extract version from .csproj
        id: read_version
        shell: bash
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' Netum.Suovi.MessageRelay/Netum.Suovi.MessageRelay.csproj)
          if [ -z "$VERSION" ]; then
            echo "::error::Did not find <Version> in Netum.Suovi.MessageRelay.csproj"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack NuGet package
        run: dotnet pack Netum.Suovi.MessageRelay/Netum.Suovi.MessageRelay.csproj --configuration Release --no-build --output ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: MessageRelay-v${{ steps.read_version.outputs.version }}
          name: MessageRelay v${{ steps.read_version.outputs.version }}
          draft: false
          prerelease: false
          files: artifacts/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
